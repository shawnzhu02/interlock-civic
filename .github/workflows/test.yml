name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: ubuntu-22.04                        # 3.9 is the floor pyproject.toml promises; newer images lack it
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dev-only test dependency (property-based tests)
        run: python -m pip install hypothesis
      - name: Invariants, fault sweep, integration
        run: python -m unittest discover -s tests -v
      - name: Results tables match the code
        if: runner.os == 'Linux'
        run: |
          python experiments/run_all.py > /dev/null
          python viewer/build.py
          git diff --exit-code -I "^Generated" -- results/
